name: Portable source checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fusion-studio
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fusion-studio/package-lock.json
      - name: Install locked dependencies without desktop downloads
        run: npm ci --ignore-scripts
      - name: Verify public documentation and tracked artifacts
        run: node scripts/check-repository.cjs
      - name: Check portable core and model protocols
        run: node --test tests/model-connections.test.cjs tests/scene-foundation.test.mjs tests/scene-units.test.mjs tests/deformation.test.mjs tests/formulas.test.mjs tests/sculpt.test.mjs tests/animation.test.mjs
      # Full default/native/desktop/import gates require installed Blender,
      # compiled native core and local fixtures. This job does not replace them.
