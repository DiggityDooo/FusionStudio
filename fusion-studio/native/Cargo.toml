[package]
name = "fusion_geometry"
version = "0.19.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "=2.16.17", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=2.16.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }

[build-dependencies]
napi-build = "=2.1.3"

[profile.release]
lto = true

